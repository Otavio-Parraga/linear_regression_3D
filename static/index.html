<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regression Cost Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="title">Linear Regression Cost Explorer</h1>
      <p class="subtitle" data-i18n="subtitle">Change the parameters and watch the cost surface respond.</p>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Scale">
        <button type="button" data-scale="original" class="active" data-i18n="scaleOriginal">Original scale</button>
        <button type="button" data-scale="normalized" data-i18n="scaleNormalized">Normalized</button>
      </div>
      <button type="button" id="langBtn" class="pill" title="Language">PT</button>
      <button type="button" id="themeBtn" class="pill" aria-label="Toggle theme">
        <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="card controls">
      <h2 data-i18n="hypothesis">Regression function</h2>
      <div id="formula" class="formula"></div>
      <div id="normNote" class="note" hidden></div>

      <div class="param">
        <label for="t0Range">θ<sub>0</sub> <span class="muted" data-i18n="intercept">intercept</span></label>
        <div class="param-row">
          <input type="range" id="t0Range">
          <input type="number" id="t0Num" step="any">
        </div>
      </div>
      <div class="param">
        <label for="t1Range">θ<sub>1</sub> <span class="muted" data-i18n="slope">slope</span></label>
        <div class="param-row">
          <input type="range" id="t1Range">
          <input type="number" id="t1Num" step="any">
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="metric-label" data-i18n="cost">Cost</span>
          <span id="jVal" class="metric-value">–</span>
        </div>
        <div class="metric">
          <span class="metric-label">∂J/∂θ<sub>0</sub></span>
          <span id="g0Val" class="metric-value">–</span>
        </div>
        <div class="metric">
          <span class="metric-label">∂J/∂θ<sub>1</sub></span>
          <span id="g1Val" class="metric-value">–</span>
        </div>
        <div class="metric">
          <span class="metric-label" data-i18n="minimum">Minimum J*</span>
          <span id="jStar" class="metric-value">–</span>
        </div>
      </div>
      <div id="costFormula" class="formula small"></div>

      <div class="gd">
        <label for="alpha">α <span class="muted" data-i18n="learningRate">learning rate</span></label>
        <input type="number" id="alpha" step="any" min="0">
        <button type="button" id="stepBtn" data-i18n="step">Step GD</button>
        <button type="button" id="runBtn" data-i18n="run">Run 30</button>
        <button type="button" id="convBtn">Run to convergence</button>
      </div>
      <p id="gdStatus" class="gd-status" aria-live="polite"></p>
      <div class="actions">
        <button type="button" id="optBtn" class="ghost" data-i18n="goOptimum">Go to θ*</button>
        <button type="button" id="resetBtn" class="ghost" data-i18n="reset">Reset</button>
      </div>
    </section>

    <section class="card surface-card">
      <div class="card-head">
        <h2 data-i18n="surfaceTitle">Cost surface J(θ₀, θ₁)</h2>
        <div class="view-tools">
          <span class="muted" data-i18n="view">View</span>
          <button type="button" class="chip" data-view="iso" data-i18n="viewIso">3D</button>
          <button type="button" class="chip" data-view="top" data-i18n="viewTop">Top</button>
          <button type="button" class="chip" data-view="t0">θ₀</button>
          <button type="button" class="chip" data-view="t1">θ₁</button>
          <span class="sep"></span>
          <span class="muted" data-i18n="rotate">Rotate</span>
          <div class="seg small" role="group">
            <button type="button" data-drag="orbit" class="active" data-i18n="orbit">Orbit</button>
            <button type="button" data-drag="turntable" data-i18n="turntable">Turntable</button>
          </div>
        </div>
      </div>
      <div id="surface" class="plot plot-3d"></div>
      <p class="hint" data-i18n="surfaceHint">Drag to rotate · scroll to zoom · right-drag to pan</p>
    </section>

    <section class="card table-card">
      <h2 data-i18n="dataTitle">Dataset and predictions</h2>
      <div class="table-wrap">
        <table id="dataTable">
          <thead></thead>
          <tbody></tbody>
          <tfoot></tfoot>
        </table>
      </div>
    </section>

    <section class="card line-card">
      <h2 data-i18n="lineTitle">Data and regression line</h2>
      <div id="linePlot" class="plot plot-2d"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
